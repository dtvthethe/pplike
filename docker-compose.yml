services:
  php:
    build:
      context: .
      dockerfile: docker/php/local/Dockerfile
    working_dir: /var/www/html
    container_name: pplike-php
    networks:
      - pplike-network
    volumes:
      - .:/var/www/html

  node:
    build:
      context: .
      dockerfile: docker/node/local/Dockerfile
    working_dir: /var/www/html
    container_name: pplike-node
    networks:
      - pplike-network
    volumes:
      - .:/var/www/html
    ports:
      - "5173:5173"

  nginx:
    image: nginx:alpine
    container_name: pplike-nginx
    depends_on:
      - php
    networks:
      - pplike-network
    volumes:
      # `ro`: read-only
      - .:/var/www/html:ro
      - ./docker/nginx/local/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:80"

networks:
  pplike-network:
    driver: bridge
