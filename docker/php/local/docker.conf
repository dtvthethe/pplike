; khai báo một `pool: là nhóm worker PHP-FPM nhận và xử lý request từ Nginx` trong cấu hình PHP-FPM có tên `www`
[www]

; tạo user có tên `appuser` và group có tên `appgroup` để chạy các worker PHP-FPM.
; UID là user ID, GID là group ID
user = appuser
group = appgroup

; Cổng PHP-FPM nhận request FastCGI; Nginx kết nối tới service `php:9000`.
listen = 9000

; `dynamic`: tự điều chỉnh số worker trong giới hạn bên dưới.
pm = dynamic

; Số worker tối đa có thể chạy cùng lúc.
pm.max_children = 5

; Số worker khởi động ban đầu.
pm.start_servers = 2

; Số worker rảnh tối thiểu cần giữ lại.
pm.min_spare_servers = 1

; Số worker rảnh tối đa cần giữ lại.
pm.max_spare_servers = 3

; Gửi stdout/stderr của worker ra log của container để dễ xem bằng Docker.
catch_workers_output = yes

; Không xóa các biến môi trường trước khi chuyển chúng cho worker PHP.
clear_env = no
